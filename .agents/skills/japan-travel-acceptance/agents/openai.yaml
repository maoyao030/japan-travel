interface:
  display_name: "日本站文章驗收"
  short_description: "格式檢查、日文原文事實查核、不會日文的讀者模擬與生成圖驗收，四層唯讀驗收"
  default_prompt: "使用 $japan-travel-acceptance 驗收指定文章：先跑格式檢查，再派事實查核 agent 逐一打開日文來源並保存原文摘錄，再派讀者驗收 agent 以不會日文的台灣旅客走一遍行程，有 AI 圖或自製示意圖時派圖片驗收 agent 實際看圖。只讀不改，寫出 review.md。"

policy:
  allow_implicit_invocation: false
